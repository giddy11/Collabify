<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="../styles/edit_profile.css">
</head>
<body>
  <div class="edit-profile-container">
    <form class="edit-profile-form">
      <div class="form-row">
        <div class="form-group">
          <label for="full-name" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="dob" class="form-label">Date of Birth</label>
          <input type="date" id="dob" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="phone" class="form-label">Phone No</label>
          <input type="tel" id="phone" class="form-input" placeholder="Enter your phone number" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="country" class="form-label">Country</label>
          <input type="text" id="country" class="form-input" placeholder="Enter your country" required>
        </div>
        <div class="form-group">
          <label for="state" class="form-label">State</label>
          <input type="text" id="state" class="form-input" placeholder="Enter your state" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="address" class="form-label">Home Address</label>
          <input type="text" id="address" class="form-input" placeholder="Enter your home address" required>
        </div>
        <div class="form-group">
          <label for="city" class="form-label">City</label>
          <input type="text" id="city" class="form-input" placeholder="Enter your city" required>
        </div>
      </div>
      <div class="form-buttons">
        <button type="submit" class="save-button">Save</button>
        <button type="button" class="cancel-button">Cancel</button>
        <button type="button" class="cancel-button">Change Password</button>
      </div>
    </form>
  </div>
</body>
</html>
