    <main>
        <div class="container">
            <aside id="side-bar" class="red">
                <div id="admin1" class="nav-icons red">
                    <div class="dashboard activec">
                        <a href="index.html">
                            <i class="fa fa-dashboard" style="font-size:23px"></i>

                            <!-- <p id="details">Dashboard</p> -->

                <div id="admin2" class="nav-icons red">
                    <div class="dashboard activec">

                    </div>
                </div>

                <div class="nav-icons red" id="admin">
                    <div class="dashboard activec">
                        <a href="directory.html">
                            <i class="material-icons" style="font-size:23px">people</i>
                            <div class="details"><p>Directory</p></div>
                        </a>
                    </div>
                </div>

                <div id="admin3" class="nav-icons red">
                    <div class="dashboard activec">
                        <a href="group.html">
                            <i class="fa fa-group" style="font-size:23px"></i>
                            <div class="details"><p>Groups</p></div>
                        </a>
                    </div>
                </div>

                <div id="admin4" class="nav-icons red">
                    <div class="dashboard activec">
                        <a href="event.html">
                            <i class="material-icons" style="font-size:23px">event</i>

                    <div class="dashboard active">
                        <a href="onboarding.html" style="color: white;">

                    <div class="dashboard activec">

                <div class="nav-icons red">
                    <div class="dashboard activec">
                        <a href="settings.html">

                        </a>
                    </div>

                <div class="nav-icons red">
                    <div class="dashboard activec">
                        <a href="help.html">
                            <i class="material-icons" style="font-size:23px">help</i>
                            <div class="details"><p>Help</p></div>
                        </a>
                    </div>
                </div>

                <div class="nav-icons red">
                    <div class="dashboard activec">
                        <form id="logout">
                            <button type="button" onclick="logout()" class="" style="display: flex; margin-left: 13px; margin-top: 6px; border: none; background-color: transparent; gap: 5px; cursor: pointer;">
                                <i class="fa fa-sign-out" style="font-size:23px"></i>
                                <div class="details"><p>Log Out</p></div>
                            </button>
                        </form>
                    </div>

            <div class="body">
                <div id="loader" class="loader" style="display: none;">
                    <div class="spinner"></div>
                  </div>
                <div class="add-week">
                  <span id="tooltipText">Add New</span>
                  <button class="add-btn">
                    <img src="../assets/svgs/library_add.svg" alt="add-record" />
                  </button>
                </div>
                <div class="container" id="item-container">
                    <div class="up-overview">
                      <!-- Items will be dynamically added here -->
                    </div>
                  </div>
                <div id="event-modal" class="modal">
                  <div class="modal-content">
                    <button class="close-btn">&times;</button>
                    <h3 class="modal-title">Onboarding Details</h3>
                    <form id="item-form">
                      <input type="hidden" id="_id" name="_id" />
                      <div class="form-group">
                        <label for="name">Week:</label>
                        <input type="text" id="name" name="name" placeholder="Enter week" />
                      </div>
                      <div class="form-group">
                        <label for="topic">Lesson Title:</label>
                        <input type="text" id="topic" name="topic" placeholder="Enter lesson title" />
                      </div>
                      <div class="form-group">
                        <label for="link">Link:</label>
                        <input type="text" id="link" name="link" placeholder="Enter lesson link" />
                      </div>
                      <div class="form-group">
                        <label for="department">Class:</label> 
                        <select id="department" name="department">
                          <option value="" disabled selected>Select option</option>
                          <option value="software">Software Development</option>
                          <option value="qa">Quality Assurance</option>
                          <option value="software">Data Science</option>
                          <option value="qa">UI/UX</option>
                          <option value="software">Product Management</option>
                          <option value="qa">Animation</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="noOfAcceptance">Number of Fellows:</label>
                        <input type="number" id="noOfAcceptance" name="noOfAcceptance" min="0" placeholder="Enter number of fellows" />
                      </div>
                      <button type="submit" class="form-btn">Submit</button>
                    </form>
                  </div>
                </div>
                <div id="view-modal" class="modal">
                    <div class="modal-content">
                      <button class="close-btn view-close-btn">&times;</button>
                      <div id="view-details" class="up-overview">
                        <!-- Item details will be dynamically added here -->
                      </div>
                      <div class="view-actions">
                        <button id="edit-btn" class="edit-btn">Edit</button>
                        <button id="delete-btn" class="del-btn">Delete</button>
                      </div>
                    </div>
                  </div>
                  
              </div>
              
        </div>
        
    </main>
    
    <script src="../assets/scripts/onboarding.js"></script>
    <script src="../assets/scripts/index.js"></script>
    <script src="../assets/scripts/logout.js"></script>
