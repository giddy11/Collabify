<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="../styles/change_pass.css">
  <link rel="stylesheet" href="../styles/index.css">
  <style>
    /* Modal styles */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Black background with opacity */
    }
    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 500px;
      text-align: center;
    }
    .modal-button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    /* Loader styles */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide loader by default */
    .loader.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="change-pass-container">
    <form class="change-pass-form" id="changePassForm">
      <label for="email" class="form-label">Please enter your email</label>
      <input type="email" id="email" class="form-input" required>
      <button type="submit" class="change-pass-button">Submit</button>
      <button type="button" class="change-pass-button" id="cancelButton">Cancel</button>
    </form>

    <!-- Loader -->
    <div id="loader" class="loader hidden"></div>
  </div>

  <!-- Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <h3>Check your inbox!</h3>
      <p>Please check your email (and spam folder) for the login details.</p>
      <button class="modal-button" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const changePassForm = document.getElementById('changePassForm');
    const confirmationModal = document.getElementById('confirmationModal');
    const cancelButton = document.getElementById('cancelButton');
    const loader = document.getElementById('loader'); // The loader element

    changePassForm.addEventListener('submit', async function(event) {
      event.preventDefault(); // Prevent form submission
      const email = document.getElementById('email').value;

      // Show the loader
      loader.classList.remove('hidden');

      // Send POST request to forgot-password endpoint
      try {
        const response = await fetch('https://collabify-oloy.onrender.com/api/auth/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: email }),
        });

        const data = await response.json();

        // Hide the loader
        loader.classList.add('hidden');

        if (data.success) {
          // Show modal if the response is successful
          confirmationModal.style.display = 'block';

          // Redirect after a brief delay
          setTimeout(function() {
            window.location.href = './signin.html'; // Redirect to the login page
          }, 3000); // Delay of 3 seconds
        } else {
          alert(data.message); // Show error message if user doesn't exist
        }
      } catch (error) {
        console.error('Error:', error);
        alert('There was an error processing your request.');

        // Hide the loader in case of error
        loader.classList.add('hidden');
      }
    });

    cancelButton.addEventListener('click', function() {
      window.location.href = './signin.html'; // Redirect to the signin page
    });

    function closeModal() {
      confirmationModal.style.display = 'none'; // Close the modal
    }
  </script>
</body>
</html>
