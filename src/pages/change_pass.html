<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="../styles/change_pass.css">
</head>
<body>
  <div class="change-pass-container">
    <form class="change-pass-form">
      <label for="old-password" class="form-label">Old Password</label>
      <input type="password" id="old-password" class="form-input" required>
      
      <label for="new-password" class="form-label">New Password</label>
      <input type="password" id="new-password" class="form-input" required>
      
      <button type="submit" class="change-pass-button">Change Password</button>
    </form>
  </div>
</body>
</html>
