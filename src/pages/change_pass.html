<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="../styles/change_pass.css">
  <style>
    /* Modal styles */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Black background with opacity */
    }
    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 500px;
      text-align: center;
    }
    .modal-button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="change-pass-container">
    <form class="change-pass-form" id="changePassForm">
      <label for="old-password" class="form-label">Old Password</label>
      <input type="password" id="old-password" class="form-input" required>
      
      <label for="new-password" class="form-label">New Password</label>
      <input type="password" id="new-password" class="form-input" required>
      
      <button type="submit" class="change-pass-button">Change Password</button>
      <button type="button" class="change-pass-button" onclick="window.location.href='./index.html'">Cancel</button>
    </form>
  </div>

  <!-- Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <h3 id="modalMessage"></h3>
      <button class="modal-button" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const changePassForm = document.getElementById('changePassForm');
    const confirmationModal = document.getElementById('confirmationModal');
    const modalMessage = document.getElementById('modalMessage');

    changePassForm.addEventListener('submit', async function(event) {
      event.preventDefault(); // Prevent form submission
      const oldPassword = document.getElementById('old-password').value;
      const newPassword = document.getElementById('new-password').value;

      // Send POST request to change-password endpoint
      try {
        const response = await fetch('https://collabify-oloy.onrender.com/api/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`, // Assuming the token is stored in localStorage
          },
          body: JSON.stringify({
            currentPassword: oldPassword,
            newPassword: newPassword,
          }),
        });

        const data = await response.json();

        if (data.success) {
          // Show success modal and redirect
          modalMessage.textContent = "Password updated successfully.";
          confirmationModal.style.display = 'block';
          setTimeout(function() {
            window.location.href = './index.html'; // Redirect to the homepage
          }, 3000); // Delay of 3 seconds
        } else {
          // Show error modal for wrong password
          modalMessage.textContent = "Wrong current password.";
          confirmationModal.style.display = 'block';
        }
      } catch (error) {
        console.error('Error:', error);
        modalMessage.textContent = "There was an error processing your request.";
        confirmationModal.style.display = 'block';
      }
    });

    function closeModal() {
      confirmationModal.style.display = 'none'; // Close the modal
    }
  </script>
</body>
</html>
