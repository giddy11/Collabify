<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../styles/sign_up.css">
</head>
<body>
  <div class="signup-container">
    <div class="logo">
      <img src="/img/collabifyLogo.png" alt="Collabify Logo">
      
    </div>
    <form class="signup-form">
      <input type="text" placeholder="Full Name" class="form-input" required>
      <input type="email" placeholder="Email" class="form-input" required>
      <input type="password" placeholder="Password" class="form-input" required>
      <button type="submit" class="signup-button">Sign Up</button>
    </form>
    <p class="signin-text">
      Have an account? <a href="/signin" class="signin-link">Sign in</a>
    </p>
  </div>
</body>
</html>
