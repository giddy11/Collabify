<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="../styles/sign_up.css" />
    <link rel="stylesheet" href="../styles/index.css" />
  </head>
  <body>
    <div class="signup-container">
      <div class="logo">
        <img src="/img/collabifyLogo.png" alt="Collabify Logo" />
      </div>
      <div id="loader" class="loader" style="display: none"></div>
      <form id="register-form" class="signup-form">
        <input
          type="text"
          placeholder="Full Name"
          id="name"
          class="form-input"
          required
        />
        <!-- <select
              name=""
              id=""
            >
              <option value="">
                Role
              </option>
              <option value="">User</option>
              <option value="">Owner</option>
            </select> -->
        <input
          type="email"
          placeholder="Email"
          id="email"
          class="form-input"
          required
        />
        <input
          type="password"
          placeholder="Password"
          id="password"
          class="form-input"
          required
        />
        <button type="submit" class="signup-button">Sign Up</button>
      </form>
      <p class="signin-text">
        Have an account? <a href="/signin" class="signin-link">Sign in</a>
      </p>
    </div>

    <script src="../assets/scripts/signup.js"></script>
  </body>
</html>
